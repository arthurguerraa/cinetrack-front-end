<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar · CineTrack</title>
<link rel="stylesheet" href="../../assets/css/output.css">
</head>
<body class="bg-night text-cream font-sans min-h-screen flex items-center justify-center px-4 sm:px-6">

  <div class="w-full max-w-sm">

    <!-- Marca -->
    <div class="text-center mb-8">
      <h1 class="font-display text-4xl font-semibold text-cream tracking-wide">CineTrack</h1>
      <p class="text-muted text-sm mt-1">Sua central de avaliações de filmes</p>
    </div>

    <!-- Trilha de sprocket — assinatura visual -->
    <div class="sprocket mb-8 opacity-60"></div>

    <!-- Card de cadastro -->
    <div class="bg-surface border border-border rounded-card px-5 sm:px-7 py-8">

      <h2 class="font-display text-xl font-semibold mb-1">Garanta sua entrada</h2>
      <p class="text-muted text-sm mb-6">Crie sua conta para avaliar filmes e montar listas.</p>

      <form id="form-cadastro" class="space-y-4" novalidate>

        <div>
          <label for="nome" class="block text-xs text-muted mb-1.5 font-medium">Nome</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Seu nome"
            required
            class="w-full bg-night border border-border rounded-card px-4 py-2.5 text-sm text-cream placeholder:text-muted focus:outline-none focus:border-amber transition-colors"
          >
          <p id="erro-nome" class="hidden text-[13px] text-red-400 mt-1.5"></p>
        </div>

        <div>
          <label for="email" class="block text-xs text-muted mb-1.5 font-medium">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nome@email.com"
            required
            class="w-full bg-night border border-border rounded-card px-4 py-2.5 text-sm text-cream placeholder:text-muted focus:outline-none focus:border-amber transition-colors"
          >
          <p id="erro-email" class="hidden text-[13px] text-red-400 mt-1.5"></p>
        </div>

        <div>
          <label for="senha" class="block text-xs text-muted mb-1.5 font-medium">Senha</label>
          <div class="relative">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Crie uma senha"
              required
              class="w-full bg-night border border-border rounded-card pl-4 pr-11 py-2.5 text-sm text-cream placeholder:text-muted focus:outline-none focus:border-amber transition-colors"
            >
            <button
              type="button"
              id="toggle-senha"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-cream transition-colors"
              aria-label="Mostrar senha"
            >
              <svg class="icone-mostrar w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg class="icone-esconder hidden w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <p id="erro-senha" class="hidden text-[13px] text-red-400 mt-1.5"></p>
        </div>

        <div>
          <label for="confirmar-senha" class="block text-xs text-muted mb-1.5 font-medium">Confirmar senha</label>
          <div class="relative">
            <input
              type="password"
              id="confirmar-senha"
              name="confirmar-senha"
              placeholder="Repita a senha"
              required
              class="w-full bg-night border border-border rounded-card pl-4 pr-11 py-2.5 text-sm text-cream placeholder:text-muted focus:outline-none focus:border-amber transition-colors"
            >
            <button
              type="button"
              id="toggle-confirmar-senha"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-cream transition-colors"
              aria-label="Mostrar senha"
            >
              <svg class="icone-mostrar w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg class="icone-esconder hidden w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <p id="erro-confirmar-senha" class="hidden text-[13px] text-red-400 mt-1.5"></p>
        </div>

        <p id="erro-geral" class="hidden text-[13px] text-red-400 bg-red-400/10 border border-red-400/30 rounded-card px-3 py-2"></p>

        <button
          type="submit"
          id="btn-cadastrar"
          class="w-full bg-amber text-night font-sans font-semibold text-sm rounded-card py-2.5 mt-2 hover:brightness-110 active:scale-[0.98] transition-all disabled:opacity-60 disabled:cursor-not-allowed"
        >
          Criar conta
        </button>

      </form>

      <div class="mt-6 pt-6 border-t border-border text-center">
        <p class="text-muted text-sm">
          Já tem conta?
          <a href="login.html" class="text-amber hover:brightness-110 font-medium">Entrar</a>
        </p>
      </div>

    </div>

    <div class="sprocket mt-8 opacity-60"></div>

  </div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>
<script src="../js/pages/cadastro.js"></script>

</body>
</html>
